<text class="m" x="120" y="240" font-size="10" fill="rgba(247,241,230,0.4)" text-anchor="middle">ICAR thresholds</text><text class="m" x="300" y="240" font-size="10" fill="rgba(247,241,230,0.4)" text-anchor="middle">agronomic rules</text><text class="m" x="480" y="240" font-size="10" fill="rgba(247,241,230,0.4)" text-anchor="middle">classical</text><text class="m" x="660" y="240" font-size="10" fill="#d79675" text-anchor="middle">quantum</text><text class="m" x="840" y="240" font-size="10" fill="rgba(247,241,230,0.4)" text-anchor="middle">rules</text>
