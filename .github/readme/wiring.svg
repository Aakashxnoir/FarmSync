<rect x="580.5" y="282.5" width="159" height="65" rx="10" fill="#1e3022" fill-opacity=".9" stroke="rgba(247,241,230,0.14)"/>
<text class="m" x="592" y="304" font-size="11.5" fill="#F7F1E6">/farms/{id}/rank</text>
<text class="b" x="592" y="322" font-size="10.5" fill="#abb2a2">POST · one call runs</text><text class="b" x="592" y="336" font-size="10.5" fill="#abb2a2">the whole pipeline</text>
<rect x="760.5" y="282.5" width="159" height="65" rx="10" fill="#1e3022" fill-opacity=".9" stroke="rgba(247,241,230,0.14)"/>
