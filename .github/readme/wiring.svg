<rect x="760.5" y="156.5" width="159" height="65" rx="10" fill="#1e3022" fill-opacity=".9" stroke="rgba(247,241,230,0.14)"/>
<text class="m" x="772" y="178" font-size="11.5" fill="#F7F1E6">advisory.py</text>
