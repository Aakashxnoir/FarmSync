<radialGradient id="glow"><stop offset="0" stop-color="#C1592A" stop-opacity=".55"/><stop offset="1" stop-color="#C1592A" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="960" height="380" rx="22"/></clipPath>
<clipPath id="scr" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx=".08" ry=".037"/></clipPath>

