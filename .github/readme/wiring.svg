<rect x="40.5" y="156.5" width="159" height="65" rx="10" fill="#1e3022" fill-opacity=".9" stroke="rgba(247,241,230,0.14)"/>
<text class="m" x="52" y="178" font-size="11.5" fill="#F7F1E6">soil_card.py</text>
<text class="b" x="52" y="196" font-size="10.5" fill="#abb2a2">readings → Low,</text><text class="b" x="52" y="210" font-size="10.5" fill="#abb2a2">Medium, High</text>
<rect x="220.5" y="156.5" width="159" height="65" rx="10" fill="#1e3022" fill-opacity=".9" stroke="rgba(247,241,230,0.14)"/>
