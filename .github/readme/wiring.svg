<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Farmer readings, crop and rotation tables, weather and NDVI feed soil_card, crop_feasibility, the LightGBM yield model, the SPARQ quantum step and advisory, served by POST /farms/{id}/rank to the Flutter app">
<title>Farmer readings, crop and rotation tables, weather and NDVI feed soil_card, crop_feasibility, the LightGBM yield model, the SPARQ quantum step and advisory, served by POST /farms/{id}/rank to the Flutter app</title>
<defs>
