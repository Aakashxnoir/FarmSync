<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="A grid of 12 qubits, 3 seasons by 4 crops, flickers through samples with one crop per season, then settles on Paddy → Black gram → Groundnut, which beats sorting by profit by ₹1,111 on the demo farm">
